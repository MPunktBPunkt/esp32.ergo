[platformio]
default_envs = ergo
src_dir = src

; ACHTUNG: keine [env]-Sektion verwenden. PlatformIO vererbt sie an JEDES
; Environment, auch an env:native — das bekommt dann framework = arduino
; mitsamt Boardpflicht und bricht mit "Please specify `board`" ab. Gemeinsame
; Werte gehoeren deshalb in [common] und werden explizit referenziert.
[common]
build_flags =
  -DFW_VERSION=\"0.3.18-dev\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3

; Nur ESP32-S3. Zwei BLE-Links im Coach, drei in der Bridge — eine zweite
; Firmware-Variante fuer ein Board, das dafuer ohnehin nicht reicht, waere
; Pflegeaufwand ohne Gegenwert. Kein PSRAM: heartrate-s3 faehrt drei Links
; plus WiFi und SSE ohne, siehe docs/ergometer/PFLICHTENHEFT.md §10.
[env:ergo]
platform = espressif32@6.4.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps = ${common.lib_deps}
extra_scripts = pre:tools/pio_pack_ui.py
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -DCONFIG_NIMBLE_CPP_DEBUG_ASSERT_ENABLED=0
; ROLE_PERIPHERAL und ROLE_BROADCASTER bleiben bewusst AN — die Bridge in
; v0.3 braucht sie, und ein spaeteres Wiedereinschalten aendert das
; Speicherlayout mitten in der Entwicklung.

; Hostseitiger Test der Arduino-freien Kernbausteine:  pio test -e native
; Bewusst ohne framework und ohne lib_deps — Codec, Limiter, Kennflaeche und
; Sweep sind Arduino-frei, und genau das soll dieser Build beweisen.
;
; Diese Liste ist eine Positivliste und muss es bleiben: `+<*>` wuerde die
; Arduino-Dateien mitziehen und das Environment sofort zerlegen. Neue Dateien
; kommen nur dann hier hinein, wenn sie wirklich ohne Arduino uebersetzen.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<ble/FtmsCodec.cpp>
  +<ble/FtmsCapabilities.cpp>
  +<ble/DebugRing.cpp>
  +<control/Limiter.cpp>
  +<control/PowerMap.cpp>
  +<control/SweepRunner.cpp>
  +<control/ControlJournal.cpp>
  +<control/ControlMode.cpp>
  +<control/PowerController.cpp>
  +<control/HrController.cpp>
  +<control/RehaController.cpp>
  +<control/WorkoutEngine.cpp>
  +<control/WorkoutJson.cpp>
  +<control/ZwoImport.cpp>
  +<control/TestRunner.cpp>
  +<control/BridgeAssist.cpp>
  +<control/SimAssist.cpp>
  +<ble/CyclingCodec.cpp>
  +<core/ProfileStore.cpp>
  +<core/SessionTracker.cpp>
  +<core/SessionStore.cpp>
  +<core/Zone.cpp>
  +<core/Progression.cpp>
  +<core/FtpCareer.cpp>
  +<core/DeviceStore.cpp>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -I src
