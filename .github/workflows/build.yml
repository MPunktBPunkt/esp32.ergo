name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Host tests
        run: pio test -e native
      - name: Fixture export roundtrip (6a)
        run: python tools/make-fixtures.py --verify-curated
      - name: Doku-Links prüfen
        run: |
          pip install 'markdown>=3.5'
          python tools/docs_html.py --check

  firmware:
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build ergo
        run: pio run -e ergo
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ergo-esp32s3
          path: .pio/build/ergo/firmware.bin
          if-no-files-found: error
